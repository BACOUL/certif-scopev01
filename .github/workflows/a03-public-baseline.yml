name: A03 - Reference publique Certif-Scope
on:
  workflow_dispatch:
  push:
    branches:
      - refonte/conserver-site-existant-20261114
    paths:
      - '.github/workflows/a03-public-baseline.yml'
      - 'scripts/a03-public-baseline.cjs'
permissions:
  contents: read
jobs:
  public-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout branch for capture script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout immutable production source for sitemap reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 71e6cd87a8c04041ff58be4db99a6fa49cb8c40a
          path: production-reference
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked capture dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture public pages only
        env:
          BASELINE_SOURCE: production-reference
          BASELINE_DIR: artifacts/a03
        run: |
          export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROMIUM_EXECUTABLE_PATH"
          node scripts/a03-public-baseline.cjs
      - name: Store public screenshots and observed HTTP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a03-public-reference
          path: artifacts/a03/
          if-no-files-found: warn
          retention-days: 30
