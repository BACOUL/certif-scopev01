name: A04 - Controle expurge des secrets
on:
  workflow_dispatch:
  push:
    branches:
      - refonte/conserver-site-existant-20261114
    paths:
      - '.github/workflows/a04-secret-guard.yml'
permissions:
  contents: read
jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked and reachable text blobs (counts only)
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, re, subprocess, sys
          # Never print a path, object ID, matching line or credential value.
          # Heuristics only: not a comprehensive secret scanner.
          rules = [
              re.compile(rb'(?<![A-Za-z0-9_])(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}'),
              re.compile(rb'(?<![A-Za-z0-9_])whsec_[A-Za-z0-9]{16,}'),
              re.compile(rb'(?<![A-Za-z0-9_])re_[A-Za-z0-9]{8,}_[A-Za-z0-9_-]{12,}'),
              re.compile(rb'(?<![A-Za-z0-9_])(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})'),
              re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'),
          ]
          fixtures = [
              b'sk_' + b'live_' + b'A'*24,
              b'wh' + b'sec_' + b'B'*24,
              b're_' + b'C'*9 + b'_' + b'D'*20,
              b'gh' + b'p_' + b'E'*36,
              b'-----BEGIN ' + b'PRIVATE KEY-----',
          ]
          for rule, fixture in zip(rules, fixtures):
              if not rule.search(fixture):
                  sys.exit('Scanner self-test failed')
          tree = subprocess.check_output(['git','ls-tree','-r','-z','HEAD'])
          head = set()
          forbidden = 0
          for record in tree.split(b'\0'):
              if not record:
                  continue
              meta, path = record.split(b'\t',1)
              mode, kind, oid = meta.split()
              if kind != b'blob':
                  continue
              head.add(oid)
              name = path.rsplit(b'/',1)[-1].lower()
              if (name == b'.env' or name.startswith(b'.env.')) and not name.endswith((b'.example',b'.sample',b'.template')):
                  forbidden += 1
          reachable = set(subprocess.check_output(
              ['git','rev-list','--objects','--all','--no-object-names']
          ).split()) | head
          checks = subprocess.check_output(
              ['git','cat-file','--batch-check=%(objectname) %(objecttype) %(objectsize)'],
              input=b'\n'.join(sorted(reachable))+b'\n'
          )
          counts = collections.Counter()
          reader = subprocess.Popen(['git','cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE)
          try:
              for line in checks.splitlines():
                  parts = line.split()
                  if len(parts) != 3:
                      counts['unreadable'] += 1
                      continue
                  oid, kind, size = parts
                  if kind != b'blob':
                      continue
                  size = int(size)
                  if size > 2_000_000:
                      counts['oversize'] += 1
                      continue
                  reader.stdin.write(oid+b'\n')
                  reader.stdin.flush()
                  header = reader.stdout.readline().split()
                  if len(header) != 3 or header[0] != oid or int(header[2]) != size:
                      sys.exit('Object read mismatch (no data emitted)')
                  data = reader.stdout.read(size)
                  if len(data) != size or reader.stdout.read(1) != b'\n':
                      sys.exit('Object read incomplete (no data emitted)')
                  if b'\0' in data:
                      counts['binary'] += 1
                      continue
                  counts['text'] += 1
                  if any(rule.search(data) for rule in rules):
                      counts['flagged'] += 1
                      if oid in head:
                          counts['head_flagged'] += 1
          finally:
              reader.stdin.close()
              reader.stdout.close()
              if reader.wait() != 0:
                  sys.exit('Object reader failed')
          print('Text blobs inspected:',counts['text'])
          print('Skipped binary / >2MB / unreadable:',counts['binary'],counts['oversize'],counts['unreadable'])
          print('Potential matches in candidate:',counts['head_flagged'])
          print('Potential matches across reachable history:',counts['flagged'])
          print('Forbidden environment files in candidate:',forbidden)
          # Known historical findings remain blocking, even if the candidate is clean.
          # No artifacts; no third-party upload; no authentication with found values.
          if forbidden or counts['flagged'] or counts['unreadable']:
              sys.exit('Potential secret exposure or unreadable objects: review privately; release blocked')
          print('No matches for these limited rules; this does not prove absence of secrets.')
          PY
