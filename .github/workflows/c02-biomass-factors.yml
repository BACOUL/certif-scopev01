name: C02 - Biomasse et chaleur sources publiques
on:
  workflow_dispatch:
  push:
    branches:
      - refonte/conserver-site-existant-20261114
    paths:
      - '.github/workflows/c02-biomass-factors.yml'
permissions:
  contents: read
jobs:
  source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query public ADEME data for biomass combustion and heat networks
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, hashlib
          base='https://data.ademe.fr/data-fair/api/v1/datasets/base-carboner/lines'
          fields=['_id','Type_Ligne',"Identifiant_de_l'élément","Type_de_l'élément","Statut_de_l'élément",'Nom_base_français','Nom_attribut_français','Nom_frontière_français','Code_de_la_catégorie','Unité_français','Contributeur','Source','Localisation_géographique','Période_de_validité','Date_de_modification','Incertitude','Type_poste','Total_poste_non_décomposé','CO2f','CH4f','CH4b','N2O','CO2b','Autres_GES']
          for name,q in [('granules','Nom_base_français:"Granulés bois"'),('buches','Nom_base_français:"Bûches"'),('plaquettes','Nom_base_français:"Plaquettes forestières"'),('chaleur','"réseau de chaleur" AND Type_Ligne:"Poste"'),('froid','"réseau de froid" AND Type_Ligne:"Poste"')]:
              url=base+'?'+urllib.parse.urlencode({'qs':q,'size':100,'select':','.join(fields)})
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Certif-Scope-methodology-review/1.0'})
              with urllib.request.urlopen(req,timeout=40) as res: raw=res.read(20_000_001)
              if len(raw)>20_000_000: raise ValueError('Response too large')
              data=json.loads(raw); rows=data.get('results',[])
              print('SEARCH '+json.dumps({'name':name,'query':q,'total':data.get('total'),'returned':len(rows),'truncated':bool(data.get('next')),'sha256':hashlib.sha256(raw).hexdigest()},ensure_ascii=False),flush=True)
              for row in rows:
                  print('CANDIDATE '+json.dumps({'search':name,'row':row},ensure_ascii=False,separators=(',',':')),flush=True)
          print('Discovery only. No scientific approval or factor activation.')
          PY
