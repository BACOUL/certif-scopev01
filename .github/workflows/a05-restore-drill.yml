name: A05 - Repetition restauration fictive
on:
  workflow_dispatch:
  push:
    branches:
      - refonte/conserver-site-existant-20261114
    paths:
      - '.github/workflows/a05-restore-drill.yml'
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 71e6cd87a8c04041ff58be4db99a6fa49cb8c40a
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: rm -f .env.local && npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore synthetic records and verify historical read route offline
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const vm = require("node:vm");
          const ts = require("typescript");
          const secret = crypto.randomBytes(32).toString("hex");
          const env = {KEY_SECRET:secret,CLOUDFLARE_ACCOUNT_ID:"fixture-account",CF_KV_NAMESPACE_ID:"fixture-namespace",CLOUDFLARE_API_TOKEN:"fixture-only"};
          let kv = new Map();
          const base = "https://api.cloudflare.com/client/v4/accounts/fixture-account/storage/kv/namespaces/fixture-namespace/values/";
          const localFetch = async (url, init) => {
            assert.ok(url.startsWith(base));
            assert.ok(!init?.method || init.method==="GET");
            const key = url.slice(base.length);
            return kv.has(key) ? Response.json(kv.get(key)) : new Response("",{status:404});
          };
          const mod = {exports:{}};
          const filename = "src/app/api/check-key/route.ts";
          vm.runInNewContext(ts.transpileModule(fs.readFileSync(filename,"utf8"),{
            compilerOptions:{module:ts.ModuleKind.CommonJS,esModuleInterop:true,target:ts.ScriptTarget.ES2020}
          }).outputText,{module:mod,exports:mod.exports,require:n=>{
            if(n==="crypto")return crypto;
            if(n==="next/server")return {NextResponse:{json:(data,opts)=>Response.json(data,opts)}};
            throw Error("Unexpected module");
          },process:{env},fetch:localFetch,console,Date,Number});
          const now = new Date();
          const future = new Date(now.getTime()+86400000).toISOString();
          const past = new Date(now.getTime()-86400000).toISOString();
          const key = i => {const body="CS-0000-0000-0000-"+String(i).padStart(4,"0");return body+"-"+crypto.createHmac("sha256",secret).update(body).digest("hex").slice(0,8).toUpperCase()};
          const rec = (credits,usedCredits,expiresAt) => ({credits,usedCredits,createdAt:now.toISOString(),expiresAt,stripeSessionId:"fixture-order",version:"v1"});
          kv.set(key(1),rec(5,2,future));
          kv.set(key(2),rec(1,1,future));
          kv.set(key(3),rec(1,0,past));
          kv.set(key(4),{...rec(1,0,future),used:true});
          kv.set("processed:fixture-order",{processedAt:now.toISOString(),product:"certif-scope-pack"});
          const source = structuredClone([...kv.entries()]);
          const request = k => new Request("https://fixture.invalid/check",{method:"POST",body:JSON.stringify({key:k})});
          const read = async k => {const r=await mod.exports.POST(request(k));return {status:r.status,body:await r.json()}};
          const baseline = await Promise.all([1,2,3,4,5].map(i=>read(key(i))));
          assert.equal(baseline[0].body.remainingCredits,3);
          assert.equal(baseline[1].body.remainingCredits,0);
          assert.equal(baseline[2].status,403);
          assert.equal(baseline[3].body.remainingCredits,0);
          assert.equal(baseline[4].status,403);
          const encryptionKey=crypto.randomBytes(32);
          const iv=crypto.randomBytes(12);
          const cipher=crypto.createCipheriv("aes-256-gcm",encryptionKey,iv);
          const data=Buffer.concat([cipher.update(JSON.stringify({version:1,records:source})),cipher.final()]);
          const tag=cipher.getAuthTag();
          const restore=(encrypted,target)=>{
            assert.equal(target.size,0,"restore destination must be empty");
            const dec=crypto.createDecipheriv("aes-256-gcm",encryptionKey,iv);
            dec.setAuthTag(tag);
            const payload=JSON.parse(Buffer.concat([dec.update(encrypted),dec.final()]).toString());
            assert.equal(payload.version,1);
            assert.ok(Array.isArray(payload.records));
            const staged=new Map(payload.records);
            assert.equal(staged.size,payload.records.length);
            return staged;
          };
          const corrupted=Buffer.from(data);corrupted[0]^=1;
          assert.throws(()=>restore(corrupted,new Map()));
          assert.throws(()=>restore(data,new Map([["new-order",{}]])));
          kv=restore(data,new Map());
          assert.deepEqual([...kv.entries()],source);
          const after=await Promise.all([1,2,3,4,5].map(i=>read(key(i))));
          assert.deepEqual(after,baseline);
          assert.equal(kv.get("processed:fixture-order").product,"certif-scope-pack");
          console.log("PASS: synthetic encrypted snapshot, exact restoration, tamper rejection, nonempty destination rejection, historical key balance/expiry/legacy/missing semantics, processed marker preserved");
          console.log("Scope: in-memory exercise only; no Cloudflare network, production export, real credentials or client data.");
          NODE
